<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Schulplan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schulplan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Farbschema sofort setzen (verhindert helles Aufblitzen beim Start)
    (function () {
      var t = null;
      try { t = localStorage.getItem('sp-theme'); } catch (e) {}
      if (!t) { try { t = window.Android && Android.isSystemDark() ? 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { t = 'light'; } }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.background = t === 'dark' ? '#0b0d13' : '#f3f4fa';
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>

  <div id="app">
    <header id="topbar"></header>
    <main id="view" class="view"></main>
    <button id="fab" class="fab" hidden></button>
    <nav id="bottomnav">

      <button data-nav="/timetable" data-root data-tab="timetable"><span class="nav-ic" id="nav-tt"></span><span class="nav-l">Stundenplan</span></button>

      <button data-nav="/calendar" data-root data-tab="calendar"><span class="nav-ic" id="nav-cal"></span><span class="nav-l">Kalender</span></button>
      <button data-nav="/more" data-root data-tab="more"><span class="nav-ic" id="nav-more"></span><span class="nav-l">Mehr</span></button>
    </nav>
  </div>
  <div id="modals"></div>
  <div id="toasts"></div>
  <div id="lock" hidden></div>
  <div id="print-area"></div>
